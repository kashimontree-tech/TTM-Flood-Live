name: Update live ThaiWater data
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/update-live-water.yml"
      - "scripts/update_live.py"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch ThaiWater and aggregate by province
        run: python scripts/update_live.py
      - name: Commit changed live data
        run: |
          git config user.name "Art TTM Live Bot"
          git config user.email "actions@users.noreply.github.com"
          git add live-water.json
          if git diff --cached --quiet; then
            echo "No data change"
          else
            git commit -m "Update live ThaiWater province data"
            git push
          fi
